<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AURUM GRAND — Where every moment is serene.</title>
<meta name="description" content="AURUM GRAND — 124 suites. One singular address. A five-star sanctuary of teal calm, quiet marble and world-class service." />
<meta name="theme-color" content="#0e2737" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%230e2737'/%3E%3Cpath d='M2.5 7.5l3.6 3.1L12 4l5.9 6.6 3.6-3.1-1.9 11.4H4.4L2.5 7.5z' fill='none' stroke='%231cc3b2' stroke-width='1.4' stroke-linejoin='round'/%3E%3C/svg%3E" />
<meta property="og:title" content="AURUM GRAND — Where every moment is serene." />
<meta property="og:description" content="124 suites. One singular address." />
<meta property="og:type" content="website" />

<!-- Poppins only — matches Roberto $font-poppins (weights 100–700) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet" />

<!-- Self-hosted icon fonts, copied from roberto-master.zip (no CDN) -->
<link rel="stylesheet" href="assets/css/font-awesome.min.css" />
<link rel="stylesheet" href="assets/css/elegant-icons.css" />

<style>
/* ============================================================
   AURUM GRAND — rebuilt verbatim on the Roberto design system
   (Colorlib "Roberto — Hotel & Resort", scss/utilities/_color.scss,
   _fonts.scss, _variables.scss)
   ============================================================ */
:root{
  --primary:#1cc3b2;          /* $primary / $hover                         */
  --heading:#2a303b;          /* $heading                                  */
  --text:#636a76;             /* $text                                     */
  --bg-gray:#e8f1f8;          /* $bg-gray                                  */
  --white:#ffffff;            /* $white                                    */
  --dark:#000000;             /* $dark                                     */
  --border:#ebebeb;           /* $border                                   */
  --secondary:#afb4bf;        /* $secondary                                */
  --dark2:#0e2737;            /* $dark2                                    */
  --overlay:rgba(14,39,55,.70);                 /* .bg-overlay             */
  --box-shadow:0 2px 40px 8px rgba(15,15,15,.15); /* $box-shadow           */
  --footer-rule:#273d4b;      /* .copywrite-content border-top             */
  --nl-field:#3e525f;         /* .nl-form input                            */
  --star:#f5b917;             /* .reviwer-rating i (Roberto)               */

  /* Roberto's #1cc3b2 measures 2.21:1 against white — kept verbatim for
     visual fidelity. For WCAG AA on button fills and small teal UI text,
     flip this single token to #12897e (4.28:1). */
  --primary-ui:#1cc3b2;
}

/* ---------- 01. Reboot (scss/_reboot.scss) ---------- */
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Poppins',sans-serif;
  font-weight:400;font-size:16px;
  color:var(--text);
  position:relative;z-index:auto;
  background-color:var(--white);
}
h1,h2,h3,h4,h5,h6{font-family:'Poppins',sans-serif;color:var(--heading);line-height:1.3;font-weight:500}
a,a:active,a:focus,a:hover{color:var(--heading);text-decoration:none;transition-duration:500ms;outline:none;font-weight:500;cursor:pointer}
li{list-style:none}
p{line-height:1.7;color:var(--text);font-size:16px;font-weight:400}
img{max-width:100%;height:auto}
ul{margin:0;padding:0}
button{font-family:'Poppins',sans-serif;cursor:pointer}
input,select,textarea{font-family:'Poppins',sans-serif}
textarea:focus,input:focus{outline:none}

.bg-overlay{position:relative;z-index:1}
.bg-overlay::after{position:absolute;content:"";height:100%;width:100%;top:0;left:0;z-index:-1;background-color:var(--overlay)}
.bg-img{background-position:center center !important;background-size:cover !important;background-repeat:no-repeat !important}
.bg-gray{background-color:var(--bg-gray) !important}

.container{width:100%;padding-right:15px;padding-left:15px;margin-right:auto;margin-left:auto}
@media (min-width:576px){.container{max-width:540px}}
@media (min-width:768px){.container{max-width:720px}}
@media (min-width:992px){.container{max-width:960px}}
@media (min-width:1200px){.container{max-width:1140px}}

/* ---------- 02. Spacing (scss/_spacing.scss) ---------- */
.mt-30{margin-top:30px}.mt-50{margin-top:50px}.mb-30{margin-bottom:30px}
.mb-50{margin-bottom:50px}.mb-100{margin-bottom:100px}
.section-padding-100{padding-top:100px;padding-bottom:100px}
.section-padding-100-0{padding-top:100px;padding-bottom:0}
.section-padding-0-100{padding-top:0;padding-bottom:100px}
.section-padding-80{padding-top:80px;padding-bottom:80px}
@media only screen and (max-width:767px){
  .section-padding-100{padding-top:70px;padding-bottom:70px}
  .section-padding-100-0{padding-top:70px}
  .section-padding-0-100{padding-bottom:70px}
}

/* ---------- 03. Preloader (scss/_preloader.scss) ---------- */
#preloader{position:fixed;width:100%;height:100%;z-index:9999999;top:0;left:0;background-color:var(--primary);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:opacity 500ms,visibility 500ms}
#preloader.done{opacity:0;visibility:hidden;pointer-events:none}
#preloader .brand-mark{color:var(--white);font-size:22px;font-weight:500;letter-spacing:4px;margin-bottom:34px}
#preloader .brand-mark i{color:var(--white);font-size:14px;margin:0 10px;vertical-align:2px}
.loader,.loader:before,.loader:after{border-radius:50%;width:2.5em;height:2.5em;animation-fill-mode:both;animation:load7 1.8s infinite ease-in-out}
.loader{color:var(--white);font-size:6px;position:relative;transform:translateZ(0);animation-delay:-.16s}
.loader:before,.loader:after{content:'';position:absolute;top:0}
.loader:before{left:-3.5em;animation-delay:-.32s}
.loader:after{left:3.5em}
@keyframes load7{0%,80%,100%{box-shadow:0 2.5em 0 -1.3em}40%{box-shadow:0 2.5em 0 0}}

/* ---------- 04. Section heading (scss/_heading.scss) ---------- */
.section-heading{position:relative;z-index:1;margin-bottom:50px}
.section-heading h6{text-transform:uppercase;color:var(--primary-ui);letter-spacing:2px;display:block;margin-bottom:10px;font-size:16px}
.section-heading h2{font-size:42px;text-transform:capitalize;margin-bottom:0;display:block;line-height:1.2}
.section-heading.white h6,.section-heading.white h2{color:var(--white)}
.section-heading.text-center{text-align:center}
@media only screen and (min-width:992px) and (max-width:1199px){.section-heading h2{font-size:36px}}
@media only screen and (min-width:768px) and (max-width:991px){.section-heading h2{font-size:30px}}
@media only screen and (max-width:767px){.section-heading h2{font-size:24px}}

/* ---------- 05. Back to top (scss/_backtotop.scss) ---------- */
#scrollUp{position:fixed;right:40px;font-size:20px;line-height:40px;width:40px;height:40px;bottom:40px;background-color:var(--primary-ui);color:var(--white);text-align:center;transition-duration:500ms;border-radius:50%;box-shadow:var(--box-shadow);z-index:15962536;border:none;opacity:0;visibility:hidden}
#scrollUp.show{opacity:1;visibility:visible}
#scrollUp:focus,#scrollUp:hover{background-color:var(--dark);color:var(--white)}
@media only screen and (max-width:767px){#scrollUp{right:20px;bottom:20px}}

/* ---------- 06. Buttons (scss/_buttons.scss) ---------- */
.roberto-btn{position:relative;z-index:1;min-width:150px;height:46px;line-height:46px;font-size:16px;font-weight:500;display:inline-block;padding:0 40px;text-align:center;text-transform:capitalize;background-color:var(--primary-ui);color:var(--white);border:none;border-radius:2px;transition-duration:500ms}
.roberto-btn:focus,.roberto-btn:hover{font-weight:500;box-shadow:var(--box-shadow);background-color:var(--white);color:var(--primary-ui)}
.roberto-btn.btn-2{min-width:180px;height:50px;line-height:46px;border:2px solid var(--primary);background-color:transparent;color:var(--white)}
.roberto-btn.btn-2:focus,.roberto-btn.btn-2:hover{color:var(--white);background-color:var(--primary-ui);box-shadow:none}
.roberto-btn i{margin-left:8px}
[dir="rtl"] .roberto-btn i{margin-left:0;margin-right:8px;transform:scaleX(-1)}
.view-detail-btn{padding:0;font-size:16px;color:var(--primary-ui);font-weight:500;background:none;border:none;transition-duration:500ms}
.view-detail-btn:hover,.view-detail-btn:focus{color:var(--dark)}
.view-detail-btn i{margin-left:6px}
[dir="rtl"] .view-detail-btn i{margin-left:0;margin-right:6px;transform:scaleX(-1)}

/* ---------- 07. Header (scss/_header.scss) ---------- */
.header-area{position:relative;z-index:100;width:100%;transition-duration:500ms;background-color:var(--primary)}
.header-area .search-form{transition-duration:350ms;transition-timing-function:ease-in;position:relative;z-index:1;width:100%;height:0;overflow:hidden;background-color:var(--primary)}
.header-area .search-form.search-form-active{height:80px;z-index:99999999}
.header-area .search-form form{position:relative;z-index:1;display:flex;align-items:center;height:80px}
.header-area .search-form form input{background-color:transparent;width:100%;height:60px;border:none;font-size:14px;color:var(--white)}
.header-area .search-form form input::placeholder{color:rgba(255,255,255,.75)}
.header-area .search-form form button{position:absolute;width:60px;height:60px;top:10px;right:0;z-index:10;border:none;background-color:transparent;cursor:pointer;font-size:18px;color:var(--white);text-align:right}
[dir="rtl"] .header-area .search-form form button{right:auto;left:0;text-align:left}

.top-header-area{position:relative;z-index:1;width:100%;height:50px;background-color:var(--dark2)}
.top-header-content{display:flex;align-items:center;justify-content:space-between}
.top-header-content .top-contact a{color:var(--white);font-size:14px;font-weight:400;line-height:50px;display:inline-block;margin-right:50px}
.top-header-content .top-contact a:last-child{margin-right:0}
.top-header-content .top-contact a i{padding-right:5px;color:var(--primary)}
[dir="rtl"] .top-header-content .top-contact a{margin-right:0;margin-left:50px}
[dir="rtl"] .top-header-content .top-contact a i{padding-right:0;padding-left:5px}
.top-header-content .top-contact a:hover,.top-header-content .top-contact a:focus{color:var(--secondary)}
.top-social-area a{display:inline-block;margin-right:30px;color:var(--white);line-height:50px;font-size:14px}
.top-social-area a:last-child{margin-right:0}
.top-social-area a:hover,.top-social-area a:focus{color:var(--primary)}
[dir="rtl"] .top-social-area a{margin-right:0;margin-left:30px}
[dir="rtl"] .top-social-area a:last-child{margin-left:0}
@media only screen and (max-width:767px){
  .top-header-content .top-contact a{margin-right:15px}
  .top-header-content .top-contact a span{display:none}
  .top-social-area a{margin-right:15px}
}
@media only screen and (min-width:768px) and (max-width:991px){
  .top-header-content .top-contact a{margin-right:30px}
  .top-header-content .top-contact a span{display:none}
}

.main-header-area{position:relative;z-index:1;background-color:var(--white)}
.roberto-navbar{display:flex;align-items:center;justify-content:space-between;height:80px}
.nav-brand{font-size:20px;font-weight:600;letter-spacing:2px;color:var(--heading);white-space:nowrap}
.nav-brand i{color:var(--primary);font-size:12px;margin:0 6px;vertical-align:2px}
.nav-brand:hover,.nav-brand:focus{color:var(--heading)}
.roberto-nav{display:flex;align-items:center}
.roberto-nav a{font-size:16px;text-transform:capitalize;color:var(--heading);font-weight:500;padding:0 20px;line-height:80px;display:inline-block;position:relative;z-index:1}
.roberto-nav a:focus,.roberto-nav a:hover{color:var(--secondary);font-weight:500}
.roberto-nav a.active::before{width:60%;height:2px;background-color:var(--primary);position:absolute;bottom:18px;left:20%;z-index:1;content:''}
.header-meta{display:flex;align-items:center;height:80px}
.search-btn{cursor:pointer;transition-duration:500ms;border:none;background:none;color:var(--heading);font-size:17px;padding:0 18px;height:80px}
.search-btn:hover,.search-btn:focus{color:var(--primary)}
.book-now-btn a{padding:0 30px;background-color:var(--primary-ui);height:80px;line-height:80px;text-align:center;color:var(--white);font-size:16px;display:inline-block}
.book-now-btn a i{padding-left:5px}
[dir="rtl"] .book-now-btn a i{padding-left:0;padding-right:5px;display:inline-block;transform:scaleX(-1)}
.book-now-btn a:hover,.book-now-btn a:focus{background-color:var(--heading);color:var(--white)}

/* language dropdown */
.lang-pill{position:relative;z-index:50;margin:0 6px}
.lang-pill > button{display:flex;align-items:center;gap:6px;border:none;background:none;color:var(--heading);font-size:14px;font-weight:500;height:80px;padding:0 12px;transition-duration:500ms}
.lang-pill > button:hover{color:var(--primary)}
.lang-menu{position:absolute;top:calc(100% - 14px);right:0;min-width:170px;background:var(--white);border-radius:6px;box-shadow:var(--box-shadow);padding:8px 0;display:none}
[dir="rtl"] .lang-menu{right:auto;left:0}
.lang-pill.open .lang-menu{display:block}
.lang-menu button{display:flex;justify-content:space-between;width:100%;border:none;background:none;padding:9px 18px;font-size:14px;color:var(--heading);font-weight:400;transition-duration:500ms}
.lang-menu button:hover{color:var(--primary)}
.lang-menu button.on{color:var(--primary-ui);font-weight:500}

/* burger + mobile nav */
.burger{display:none;border:none;background:none;width:44px;height:44px;position:relative;z-index:20}
.burger i{display:block;width:24px;height:2px;background-color:var(--heading);margin:5px auto;transition-duration:500ms}
.mobile-nav{position:fixed;top:0;left:-290px;width:280px;height:100vh;background-color:var(--white);z-index:9999999;box-shadow:var(--box-shadow);transition-duration:500ms;padding:80px 30px 30px;overflow-y:auto}
.mobile-nav.on{left:0}
[dir="rtl"] .mobile-nav{left:auto;right:-290px}
[dir="rtl"] .mobile-nav.on{right:0}
.mobile-nav a{display:block;font-size:16px;text-transform:capitalize;color:var(--heading);font-weight:500;padding:12px 0;border-bottom:1px solid var(--border)}
.mobile-nav a:hover{color:var(--primary)}
.mobile-nav .close-nav{position:absolute;top:22px;right:24px;border:none;background:none;font-size:18px;color:var(--heading)}
[dir="rtl"] .mobile-nav .close-nav{right:auto;left:24px}
.nav-scrim{position:fixed;inset:0;background:rgba(14,39,55,.5);z-index:999999;opacity:0;visibility:hidden;transition-duration:500ms}
.nav-scrim.on{opacity:1;visibility:visible}
@media only screen and (max-width:991px){
  .roberto-nav{display:none}
  .burger{display:block}
  .roberto-navbar{height:70px}
  .header-meta{height:70px}
  .search-btn{height:70px}
  .lang-pill > button{height:70px}
  .book-now-btn a{height:50px;line-height:50px;border-radius:30px}
}
@media only screen and (max-width:575px){
  .book-now-btn{display:none}
  .nav-brand{font-size:16px}
}

/* ---------- 08. Hero (scss/_hero.scss) ---------- */
.welcome-area{position:relative;z-index:1}
.welcome-slides{position:relative;z-index:1;overflow:hidden;height:770px}
.single-welcome-slide{position:absolute;inset:0;z-index:1;width:100%;height:770px;background-color:var(--primary);opacity:0;visibility:hidden;transition:opacity 800ms ease,visibility 800ms ease}
.single-welcome-slide.on{opacity:1;visibility:visible;z-index:2}
.welcome-content{height:100%;display:flex;align-items:center}
.welcome-text{position:relative;z-index:1;text-align:center;width:100%}
.welcome-text h6{text-transform:uppercase;letter-spacing:2px;color:var(--white);margin-bottom:30px;font-size:16px}
.welcome-text h2{font-size:72px;display:block;margin-bottom:30px;color:var(--white)}
.welcome-slides .slide-arrow{transition-duration:500ms;width:80px;height:80px;border-radius:50%;background-color:var(--primary-ui);border:none;color:var(--white);font-size:22px;position:absolute;top:50%;left:30px;margin-top:-40px;z-index:10;opacity:0;visibility:hidden}
.welcome-slides .slide-arrow.next{left:auto;right:30px}
.welcome-slides:hover .slide-arrow,.welcome-slides:focus-within .slide-arrow{opacity:1;visibility:visible}
.welcome-slides .slide-arrow:hover{background-color:var(--heading)}
@media only screen and (min-width:992px) and (max-width:1199px){
  .welcome-slides,.single-welcome-slide{height:600px}
  .welcome-text h2{font-size:48px}
}
@media only screen and (min-width:768px) and (max-width:991px){
  .welcome-slides,.single-welcome-slide{height:600px}
  .welcome-text h2{font-size:42px}
}
@media only screen and (max-width:767px){
  .welcome-slides,.single-welcome-slide{height:700px}
  .welcome-text h2{font-size:30px}
  .welcome-slides .slide-arrow{width:40px;height:40px;left:20px;margin-top:-20px;font-size:16px}
  .welcome-slides .slide-arrow.next{left:auto;right:20px}
}

/* ---------- 09. Booking form (Roberto .hotel-search-form) ---------- */
.home-booking-area{position:relative;z-index:100;margin-top:-75px;padding-left:10%;padding-right:10%}
.home-booking-area.static{margin-top:0;padding:0}
.hotel-search-form{position:relative;z-index:1;width:100%;box-shadow:var(--box-shadow);padding:40px;border-radius:5px;background-color:var(--white)}
.hotel-search-form form{display:grid;grid-template-columns:1fr 1fr .8fr 1.1fr;gap:30px;align-items:end}
.hotel-search-form label{font-size:16px;font-weight:500;color:var(--heading);display:block;margin-bottom:10px}
.hotel-search-form .form-control{width:100%;height:50px;border:1px solid var(--border);font-size:13px;padding:0 15px;color:var(--text);border-radius:0;background:var(--white);transition-duration:500ms}
.hotel-search-form .form-control:focus{box-shadow:none;border-color:var(--primary)}
.hotel-search-form .roberto-btn{width:100%;padding:0 20px;height:50px;line-height:50px}
@media only screen and (min-width:992px) and (max-width:1199px){.home-booking-area{padding-left:2%;padding-right:2%}}
@media only screen and (max-width:991px){.home-booking-area{padding-left:0;padding-right:0}}
@media only screen and (max-width:767px){
  .home-booking-area{margin-top:-60px;padding-left:15px;padding-right:15px}
  .hotel-search-form{padding:30px}
  .hotel-search-form form{grid-template-columns:1fr 1fr}
  .hotel-search-form .roberto-btn{grid-column:1/-1}
}

/* ---------- 10. About (scss/_about.scss) ---------- */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}
.about-us-content{position:relative;z-index:1}
.about-us-content h5{line-height:1.8;color:var(--text);margin-bottom:30px;font-weight:400;font-size:20px}
.about-us-content p{margin-bottom:30px}
.about-us-content p span{color:var(--primary)}
.about-us-thumbnail{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:0}
.about-us-thumbnail .single-thumb{position:relative;z-index:1;margin:5px;display:block;overflow:hidden;border-radius:6px}
.about-us-thumbnail .single-thumb img{transition-duration:500ms;border-radius:6px;width:100%;height:100%;object-fit:cover;display:block}
.about-us-thumbnail .single-thumb:hover img,.about-us-thumbnail .single-thumb:focus img{transform:scale(1.15)}
.about-us-thumbnail .thumb-col{display:flex;flex-direction:column}
.about-us-thumbnail .thumb-col .single-thumb{flex:1}
@media only screen and (max-width:991px){.about-grid{grid-template-columns:1fr}}

/* ---------- 11. Services / amenities ---------- */
.service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.single-service-area{position:relative;z-index:1;background-color:var(--white);box-shadow:0 2px 14px 5px rgba(20,20,20,.05);border-radius:3px;padding:40px 30px;text-align:center;transition-duration:500ms}
.single-service-area .service-icon{font-size:34px;color:var(--primary);margin-bottom:20px;display:inline-block}
.single-service-area h5{margin-bottom:15px;transition-duration:500ms;font-size:22px}
.single-service-area p{margin-bottom:0;font-size:15px}
.single-service-area:hover h5,.single-service-area:focus h5{color:var(--primary)}
@media only screen and (min-width:768px) and (max-width:991px){.service-grid{grid-template-columns:repeat(2,1fr)}}
@media only screen and (max-width:767px){.service-grid{grid-template-columns:1fr}}

/* ---------- 12. Rooms (scss/_room.scss) ---------- */
.single-room-slide{position:relative;z-index:1;min-height:700px;background-color:var(--dark2);display:flex;flex-wrap:wrap}
.single-room-slide .room-thumbnail{flex:0 0 50%;max-width:50%;width:50%}
.single-room-slide .room-content{background-color:var(--dark2);flex:0 0 50%;max-width:50%;width:50%;padding:80px 15px 80px 80px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.single-room-slide.reverse{flex-direction:row-reverse}
.single-room-slide.reverse .room-content{padding:80px 80px 80px 15px}
[dir="rtl"] .single-room-slide .room-content{padding:80px 80px 80px 15px}
[dir="rtl"] .single-room-slide.reverse .room-content{padding:80px 15px 80px 80px}
.single-room-slide .room-content > h6{text-transform:uppercase;letter-spacing:2px;color:var(--primary);margin-bottom:15px}
.single-room-slide .room-content h2{color:var(--white);font-size:48px;display:block;margin-bottom:15px}
.single-room-slide .room-content h3{color:var(--primary);font-size:36px;display:block;margin-bottom:25px}
.single-room-slide .room-content h3 span{color:var(--white);font-size:16px}
.single-room-slide .room-feature{position:relative;z-index:1;margin-bottom:30px}
.single-room-slide .room-feature li{color:var(--white);display:block;margin-bottom:15px}

.footer-nav li a{display:block;margin-bottom:10px;color:var(--secondary);font-size:14px;font-weight:400;text-transform:capitalize}

#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);background:var(--dark2);color:var(--white);font-size:14px;padding:12px 24px;border-radius:30px;box-shadow:var(--box-shadow);opacity:0;visibility:hidden;transition-duration:500ms;z-index:99999999}
#toast.on{opacity:1;visibility:visible;transform:translate(-50%,0)}

[data-reveal]{opacity:0;transform:translateY(30px);transition:opacity .8s ease,transform .8s ease}

/* ============================================================
   3 · WHATSAPP LAYER  (number never appears in the DOM)
   ============================================================ */
const WA = {
  link(msg){
    return 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(msg);
  },
  open(key, extra){
    const msg = WA.compose(key, extra);
    const url = WA.link(msg);
    let win = null;
    try { win = window.open(url, '_blank', 'noopener,noreferrer'); } catch(e){ win = null; }
    if(!win){                       // popup blocked -> fall back to the hidden bridge
      const a = $('#waBridge');
      a.href = url;
      a.click();
    }
    WA.toast(state.lang === 'ar'
      ? 'جارٍ فتح واتساب…'
      : (state.lang === 'fr' ? 'Ouverture de WhatsApp…'
      : (state.lang === 'sw' ? 'Inafungua WhatsApp…' : 'Opening WhatsApp…')));
  },
  compose(key, x={}){
    const L = state.lang;
    const lines = [];
    switch(key){
      case 'reserve-header':
      case 'reserve-footer':
        lines[0] = 'Hello AURUM GRAND, I would like to reserve a suite.';
        lines[1] = 'Please share availability and your best rate.';
        break;
      case 'fab':
        lines[0] = 'Hello AURUM GRAND — I would like to speak with the concierge.';
        break;
      case 'availability':
        lines[0] = 'Hello AURUM GRAND, I would like to check availability.';
        lines[1] = 'Check-in: '  + (x.in  || '—');
        lines[2] = 'Check-out: ' + (x.out || '—');
        lines[3] = 'Guests: '    + (x.guests || '2');
        lines[4] = 'Suite: '     + (x.suite || 'Any suite');
        break;
      case 'suite':
        lines[0] = 'Hello AURUM GRAND, I would like to reserve the ' + x.name + '.';
        lines[1] = 'Rate: ' + x.price + ' per night';
        if(x.in)  lines.push('Check-in: '  + x.in);
        if(x.out) lines.push('Check-out: ' + x.out);
        lines.push('Guests: ' + (x.guests || '2'));
        break;
      case 'dining':
        lines[0] = 'Hello AURUM GRAND, I would like to reserve a table at ' + (x.venue || 'The Gilded Table') + '.';
        lines[1] = 'Date: '   + (x.date || '—');
        lines[2] = 'Time: '   + (x.time || '—');
        lines[3] = 'Guests: ' + (x.guests || '2');
        break;
      case 'spa':
        lines[0] = 'Hello AURUM GRAND, I would like to book a spa treatment.';
        lines[1] = 'Treatment: ' + (x.name || '—');
        lines[2] = 'Preferred: ' + (x.when || '—');
        break;
      case 'events':
        lines[0] = 'Hello AURUM GRAND, I would like to enquire about a private event.';
        lines[1] = 'Name: '  + (x.name || '—');
        lines[2] = 'Email: ' + (x.email || '—');
        lines[3] = 'Event: ' + (x.type || '—');
        lines[4] = 'Guests: '+ (x.guests || '—');
        lines[5] = 'Date: '  + (x.date || '—');
        if(x.notes) lines.push('Notes: ' + x.notes);
        break;
      case 'contact':
        lines[0] = 'Hello AURUM GRAND — ' + (x.name || 'a guest') + ' here.';
        if(x.email) lines.push('Email: ' + x.email);
        if(x.subject) lines.push('Subject: ' + x.subject);
        if(x.notes) lines.push(x.notes);
        break;
      case 'newsletter':
        lines[0] = 'Hello AURUM GRAND, please add me to your private list.';
        lines[1] = 'Email: ' + (x.email || '—');
        break;
      default:
        lines[0] = 'Hello AURUM GRAND.';
    }
    if(L === 'fr') lines.push('(Merci de me répondre en français.)');
    if(L === 'sw') lines.push('(Tafadhali nijibu kwa Kiswahili.)');
    if(L === 'ar') lines.push('(الرجاء الرد بالعربية.)');
    return lines.join('\n');
  },
  toast(msg){
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(WA._tt);
    WA._tt = setTimeout(()=> el.classList.remove('on'), 2600);
  }
};
document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-wa]');
  if(!el) return;
  e.preventDefault();
  const key = el.dataset.wa;
  const extra = {};
  if(el.dataset.suite) extra.name = el.dataset.suite;
  if(el.dataset.price) extra.price = el.dataset.price;
  if(el.dataset.venue) extra.venue = el.dataset.venue;
  if(el.dataset.item)  extra.name  = el.dataset.item;
  const form = el.closest('form') || el.closest('[data-form]');
  if(form){
    const ci = form.querySelector('[name=in]'), co = form.querySelector('[name=out]');
    const gs = form.querySelector('[name=guests]'), tm = form.querySelector('[name=time]');
    if(ci && ci.value) extra.in = ci.value;
    if(co && co.value) extra.out = co.value;
    if(gs && gs.value) extra.guests = gs.value;
    if(tm && tm.value) extra.time = tm.value;
  }
  WA.open(key, extra);
});

/* ============================================================
   5 · UI SYSTEMS
   ============================================================ */
const ROUTES = [
  { path:'/',        key:'home' },
  { path:'/rooms',   key:'rooms' },
  { path:'/dining',  key:'dining' },
  { path:'/spa',     key:'spa' },
  { path:'/events',  key:'events' },
  { path:'/contact', key:'contact' }
];

function navItems(){
  const labels = t('nav');
  return [
    { h:'#/',        l:t('home') },
    { h:'#/rooms',   l:labels[0] },
    { h:'#/dining',  l:labels[1] },
    { h:'#/spa',     l:labels[2] },
    { h:'#/events',  l:labels[3] },
    { h:'#/contact', l:labels[4] }
  ];
}

function buildNav(){
  const items = navItems();
  $('#navMain').innerHTML = items.map(i => `<a href="${i.h}" data-route="${i.h}">${i.l}</a>`).join('');
  $('#mobileNavLinks').innerHTML = items.map(i => `<a href="${i.h}" data-route="${i.h}">${i.l}</a>`).join('');
}

function buildFooter(){
  $('#year').textContent = new Date().getFullYear();
  const brand = `
    <div class="single-footer-widget">
      <a class="footer-logo" href="#/">AURUM<i class="icon_star" aria-hidden="true"></i>GRAND</a>
      <p>124 suites above the Golden Mile. A house of marble, brass and quiet service since 1924.</p>
      <span><i class="icon_pin" aria-hidden="true"></i>Golden Mile, Upper Hill, Nairobi</span>

        <input type="email" id="nlEmail" name="email" required placeholder="${t('nlPh')}">

function buildLangMenu(){
  $('#langMenu').innerHTML = Object.keys(I18N).map(k =>
    `<button type="button" data-lang="${k}" class="${k===state.lang?'on':''}" role="option" aria-selected="${k===state.lang}"><span>${I18N[k].label}</span><span>${k.toUpperCase()}</span></button>`
  ).join('');
  $('#langCur').textContent = state.lang.toUpperCase();
}

function applyI18nStatic(){
  $$('[data-i18n]').forEach(el => { const v = t(el.dataset.i18n); if(v) el.textContent = v; });
  document.documentElement.lang = state.lang;
  document.documentElement.dir = I18N[state.lang].dir;
  $('#searchFormInput').placeholder = t('searchPh');
}

/* ---------- reveal (Roberto wow fadeInUp equivalent) ---------- */
let revealIO = null;
function initReveal(root){
  const nodes = $$('[data-reveal]', root);
  if(!('IntersectionObserver' in window)){
    nodes.forEach(el => el.classList.add('in'));
    return;
  }
  if(revealIO) revealIO.disconnect();
  revealIO = new IntersectionObserver((entries)=>{
    entries.forEach(e => {
      if(e.isIntersecting){ e.target.classList.add('in'); revealIO.unobserve(e.target); }
    });
  }, { threshold:0.1, rootMargin:'0px 0px -6% 0px' });
  nodes.forEach(el => revealIO.observe(el));
}

/* ---------- sliders ---------- */
let heroTimer = null, testiTimer = null;
function initHeroSlider(){
  const wrap = $('#welcomeSlides');
  if(!wrap) return;
  const slides = $$('.single-welcome-slide', wrap);
  let idx = 0;
  const show = n => {
    idx = (n + slides.length) % slides.length;
    slides.forEach((s,i)=> s.classList.toggle('on', i === idx));
  };
  $$('[data-slide]', wrap).forEach(b => b.addEventListener('click', ()=>{
    show(idx + Number(b.dataset.slide));
    restart();
  }));
  const restart = () => {
    clearInterval(heroTimer);
    heroTimer = setInterval(()=> show(idx + 1), 7000);
  };
  restart();
}
function initTestiSlider(){
  const wrap = $('#testiSlides');
  if(!wrap) return;
  const slides = $$('.single-testimonial-slide', wrap);
  const dots = $$('#testiDots button');
  let idx = 0;
  const show = n => {
    idx = (n + slides.length) % slides.length;
    slides.forEach((s,i)=> s.classList.toggle('on', i === idx));
    dots.forEach((d,i)=> d.classList.toggle('active', i === idx));
  };
  dots.forEach(d => d.addEventListener('click', ()=>{
    show(Number(d.dataset.dot));
    restart();
  }));
  const restart = () => {
    clearInterval(testiTimer);
    testiTimer = setInterval(()=> show(idx + 1), 6000);
  };
  restart();
}

/* ---------- chrome (bound once) ---------- */
function bindChrome(){
  // search toggle
  $('#searchToggle').addEventListener('click', ()=>{
    const w = $('#searchWrap');
    const on = w.classList.toggle('search-form-active');
    if(on) $('#searchFormInput').focus();
  });
  $('#searchForm').addEventListener('submit', e => {
    e.preventDefault();
    $('#searchWrap').classList.remove('search-form-active');
    location.hash = '#/rooms';
    WA.toast(state.lang === 'ar' ? 'استكشف الأجنحة' : 'Explore the suites');
  });

  // burger / mobile nav
  const closeNav = () => { $('#mobileNav').classList.remove('on'); $('#navScrim').classList.remove('on'); document.body.style.overflow=''; };
  $('#burger').addEventListener('click', ()=>{
    $('#mobileNav').classList.add('on');
    $('#navScrim').classList.add('on');
    document.body.style.overflow = 'hidden';
  });
  $('#closeNav').addEventListener('click', closeNav);
  $('#navScrim').addEventListener('click', closeNav);
  $('#mobileNavLinks').addEventListener('click', e => { if(e.target.closest('a')) closeNav(); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape'){ closeNav(); $('#langPill').classList.remove('open'); } });

  // language pill
  const pill = $('#langPill');
  pill.querySelector('button').addEventListener('click', ()=>{
    pill.classList.toggle('open');
    pill.querySelector('button').setAttribute('aria-expanded', pill.classList.contains('open'));
  });
  $('#langMenu').addEventListener('click', e => {
    const b = e.target.closest('[data-lang]');
    if(!b) return;
    state.lang = b.dataset.lang;
    localStorage.setItem('ag-lang', state.lang);
    pill.classList.remove('open');
    buildLangMenu(); buildNav(); buildFooter(); applyI18nStatic();
    render(state.route, true);
  });
  document.addEventListener('click', e => { if(!e.target.closest('#langPill')) pill.classList.remove('open'); });

  // menu tabs (delegated once)
  document.addEventListener('click', e => {
    const tab = e.target.closest('.menu-tabs .tab');
    if(!tab) return;
    const scope = tab.dataset.scope;
    $$('.menu-tabs .tab').forEach(x => { if(x.dataset.scope === scope) x.classList.remove('on'); });
    tab.classList.add('on');
    $$('[data-panel]').forEach(p => {
      if(p.dataset.scope !== scope) return;
      p.style.display = (p.dataset.panel === tab.dataset.tab) ? '' : 'none';
    });
  });

  // back to top
  const su = $('#scrollUp');
  su.addEventListener('click', ()=> window.scrollTo({ top:0, behavior:'smooth' }));
  window.addEventListener('scroll', ()=> su.classList.toggle('show', window.scrollY > 400), { passive:true });

  // newsletter (footer is rebuilt on language change -> delegate)
  document.addEventListener('submit', e => {
    if(e.target.id === 'nlForm'){
      e.preventDefault();
      const email = (e.target.querySelector('[name=email]') || {}).value || '';
      WA.open('newsletter', { email });
      e.target.reset();
    }
  });
}

/* ---------- forms ---------- */
document.addEventListener('submit', e => {
  const form = e.target;
  const val = n => (form.querySelector('[name='+n+']') || {}).value || '';

  if(form.id === 'availForm'){
    e.preventDefault();
    const inn = val('in'), out = val('out');
    if(inn && out && out <= inn){
      WA.toast('Check-out must be after check-in');
      return;
    }
    WA.open('availability', { in:inn, out:out, guests:val('guests'), suite:t('anySuite') });
  }
  if(form.id === 'contactForm'){
    e.preventDefault();
    WA.open('contact', { name:val('name'), email:val('email'), subject:val('subject'), notes:val('notes') });
  }
  if(form.id === 'eventForm'){
    e.preventDefault();
    WA.open('events', { name:val('name'), email:val('email'), type:val('type'), guests:val('guests'), date:val('date'), time:val('time'), notes:val('notes') });
  }
});

/* ============================================================
   6 · ROUTER (hash routes preserved: #/, #/rooms, #/dining,
                #/spa, #/events, #/contact)
   ============================================================ */
function currentPath(){
  const h = location.hash.replace(/^#/, '');
  if(!h || h === '/') return '/';
  return h.split('?')[0];
}

function render(path, keepScroll){
  const route = ROUTES.find(r => r.path === path) || ROUTES[0];
  state.route = route.path;
  clearInterval(heroTimer);
  clearInterval(testiTimer);
  const app = $('#app');
  app.innerHTML = PAGES[route.key]();
  $$('[data-route]').forEach(a => a.classList.toggle('active', a.dataset.route === '#' + route.path));
  if(!keepScroll) window.scrollTo({ top:0, behavior:'auto' });
  initReveal(app);
  initHeroSlider();
  initTestiSlider();
  document.title = route.key === 'home'
    ? TITLE_BASE
    : ('AURUM GRAND — ' + route.key.charAt(0).toUpperCase() + route.key.slice(1));
}

window.addEventListener('hashchange', ()=>{
  const h = location.hash.replace(/^#/, '');
  if(h && !h.startsWith('/')){
    const el = document.getElementById(h);
    if(el){ el.scrollIntoView({ behavior:'smooth', block:'start' }); return; }
  }
  render(h.startsWith('/') ? h.split('?')[0] : '/');
});

/* ============================================================
   7 · BOOT
   ============================================================ */
function boot(){
  if(!location.hash) history.replaceState(null, '', '#/');
  buildLangMenu();
  buildNav();
  buildFooter();
  applyI18nStatic();
  bindChrome();
  const h = location.hash.replace(/^#/, '');
  render(h.startsWith('/') ? h.split('?')[0] : '/');
  setTimeout(()=> $('#preloader').classList.add('done'), 500);
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
